<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Visions</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Special+Elite&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <script src="js/preview-access.js"></script>
    <script>
      PreviewAccess.requireAccess("home.html");
    </script>
  </head>
  <body>
    <div class="page-background" aria-hidden="true"></div>

    <header class="site-header">
      <nav class="site-nav" aria-label="Primary">
        <a class="site-nav-link" href="home.html">Home</a>
        <a class="site-nav-link site-nav-link--active" href="index.html">Shop</a>
        <a class="site-nav-link" href="about.html">About Me</a>
      </nav>
      <a href="home.html">
        <img
          class="site-logo"
          src="images/logo/visionsstudiostaroveris.png?v=2"
          alt="Visions"
        />
      </a>
      <button type="button" class="cart-button" id="cart-open-btn" aria-label="View cart">
        <svg class="cart-button__icon" viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M7 18a2 2 0 1 0 0 4 2 2 0 0 0 0-4Zm10 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4ZM6.3 6h14.7l-1.4 7.2a1 1 0 0 1-1 .8H8.8a1 1 0 0 1-1-.9L6.3 6Zm-.8-2a1 1 0 0 1 1-1h1.6a1 1 0 0 1 .98.8L9.4 6H19a1 1 0 0 1 .98 1.17l-1.5 7.5a3 3 0 0 1-2.94 2.33H8.4a3 3 0 0 1-2.94-2.4L3.1 4.8A1 1 0 0 1 4.1 4h1.4Z"
          />
        </svg>
        <span id="cart-count" class="cart-button__count" hidden>0</span>
      </button>
    </header>

    <main>
      <h1 class="section-label">Shop</h1>
      <div id="shop-grid" class="shop-grid" aria-live="polite"></div>
    </main>

    <section class="instagram-section" aria-labelledby="instagram-heading">
      <div class="instagram-section__header">
        <h2 id="instagram-heading" class="instagram-section__title">
          <em>Instagram</em>
        </h2>
        <a
          class="instagram-section__link"
          href="https://www.instagram.com/visionssclothing/"
          target="_blank"
          rel="noopener noreferrer"
        >
          @visionssclothing
        </a>
      </div>

      <div class="instagram-carousel">
        <button
          class="instagram-carousel__nav instagram-carousel__nav--prev"
          type="button"
          aria-label="Scroll Instagram photos left"
        >
          ‹
        </button>
        <div id="instagram-track" class="instagram-carousel__track"></div>
        <button
          class="instagram-carousel__nav instagram-carousel__nav--next"
          type="button"
          aria-label="Scroll Instagram photos right"
        >
          ›
        </button>
      </div>
    </section>

    <footer class="site-footer">
      <div class="site-footer__inner">
        <a
          class="site-footer__social"
          href="https://www.instagram.com/visionssclothing/"
          target="_blank"
          rel="noopener noreferrer"
        >
          @visionssclothing
        </a>
        <a class="site-footer__logo-link" href="home.html">
          <img
            class="site-footer__logo"
            src="images/logo/visionsstudiostaroveris.png?v=2"
            alt="Visions"
          />
        </a>
        <a
          class="site-footer__social"
          href="https://www.tiktok.com/@visionscreative"
          target="_blank"
          rel="noopener noreferrer"
        >
          @visionscreative
        </a>
      </div>
    </footer>

    <script src="js/products.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/cart-drawer.js"></script>
    <script src="js/instagram.js"></script>
    <script src="js/instagram-carousel.js"></script>
    <script src="js/home.js"></script>
  </body>
</html>
