<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Visions Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Special+Elite&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body class="landing-page">
    <header class="site-header">
      <nav class="site-nav" aria-label="Primary">
        <a class="site-nav-link site-nav-link--active" href="home.html">Home</a>
        <a class="site-nav-link" href="about.html">About Me</a>
      </nav>
      <a href="home.html">
        <img
          class="site-logo"
          src="images/logo/visionsstudiostaroveris.png?v=2"
          alt="Visions Studio"
        />
      </a>
      <div class="site-header__socials">
        <a
          class="site-header__social"
          href="https://www.instagram.com/visionssclothing/"
          target="_blank"
          rel="noopener noreferrer"
        >
          Instagram
        </a>
        <a
          class="site-header__social"
          href="https://www.tiktok.com/@visionscreative"
          target="_blank"
          rel="noopener noreferrer"
        >
          TikTok
        </a>
      </div>
    </header>

    <main class="landing-main">
      <section class="landing-hero" aria-label="Visions Studio hero">
        <a
          class="landing-hero__link"
          href="https://www.instagram.com/visionssclothing/"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Visit Visions on Instagram"
        >
          <div class="landing-hero__media">
            <video
              id="landing-hero-video"
              class="landing-hero__video"
              autoplay
              muted
              loop
              playsinline
              preload="auto"
              aria-hidden="true"
            >
              <source src="images/home/hero-animation-hero.mp4?v=5" type="video/mp4" />
            </video>
          </div>
        </a>
        <div class="landing-hero__banner">
          <p class="landing-hero__caption">Shop Coming Soon</p>
        </div>
      </section>

      <section class="preview-access-bar" aria-label="Preview access">
        <form id="preview-access-form" class="preview-access-bar__form">
          <label class="preview-access-bar__label" for="preview-access-password">Preview access</label>
          <div class="preview-access-bar__controls">
            <input
              type="password"
              id="preview-access-password"
              class="preview-access-bar__input"
              autocomplete="current-password"
              placeholder="Password"
            />
            <button type="submit" class="preview-access-bar__button">Enter</button>
          </div>
          <p id="preview-access-error" class="preview-access-bar__error" hidden>Incorrect password</p>
        </form>
      </section>
    </main>

    <footer class="site-footer">
      <div class="site-footer__inner">
        <a
          class="site-footer__social"
          href="https://www.instagram.com/visionssclothing/"
          target="_blank"
          rel="noopener noreferrer"
        >
          @visionssclothing
        </a>
        <a class="site-footer__logo-link" href="home.html">
          <img
            class="site-footer__logo"
            src="images/logo/visionsstudiostaroveris.png?v=2"
            alt="Visions Studio"
          />
        </a>
        <a
          class="site-footer__social"
          href="https://www.tiktok.com/@visionscreative"
          target="_blank"
          rel="noopener noreferrer"
        >
          @visionscreative
        </a>
      </div>
    </footer>

    <script src="js/preview-access.js"></script>
    <script src="js/home-landing.js"></script>
    <script>
      PreviewAccess.initUnlockForm();
    </script>
  </body>
</html>
