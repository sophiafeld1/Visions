<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product — Visions</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Special+Elite&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="page-background" aria-hidden="true"></div>

    <header class="site-header">
      <nav class="site-nav" aria-label="Primary">
        <a class="site-nav-link" href="home.html">Home</a>
        <a class="site-nav-link" href="index.html">Shop</a>
        <a class="site-nav-link" href="about.html">About Me</a>
      </nav>
      <a href="home.html">
        <img
          class="site-logo"
          src="images/logo/visionsstudiostaroveris.png?v=2"
          alt="Visions"
        />
      </a>
      <button type="button" class="cart-button" id="cart-open-btn" aria-label="View cart">
        <svg class="cart-button__icon" viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M7 18a2 2 0 1 0 0 4 2 2 0 0 0 0-4Zm10 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4ZM6.3 6h14.7l-1.4 7.2a1 1 0 0 1-1 .8H8.8a1 1 0 0 1-1-.9L6.3 6Zm-.8-2a1 1 0 0 1 1-1h1.6a1 1 0 0 1 .98.8L9.4 6H19a1 1 0 0 1 .98 1.17l-1.5 7.5a3 3 0 0 1-2.94 2.33H8.4a3 3 0 0 1-2.94-2.4L3.1 4.8A1 1 0 0 1 4.1 4h1.4Z"
          />
        </svg>
        <span id="cart-count" class="cart-button__count" hidden>0</span>
      </button>
    </header>

    <main class="product-page">
      <article class="product-detail">
        <div class="product-detail__gallery">
          <div id="product-gallery-grid" class="product-gallery-grid"></div>
        </div>

        <aside class="product-detail__sidebar">
          <a class="back-link" href="index.html">← Back to shop</a>

          <h1 id="product-name" class="product-detail__title"></h1>
          <p id="product-price" class="product-detail__price"></p>

          <div class="product-size-selector">
            <span class="product-size-selector__label">Size</span>
            <div id="product-sizes" class="product-size-selector__options"></div>
            <p id="product-stock" class="product-size-selector__stock"></p>
          </div>

          <div class="add-to-cart">
            <button id="add-to-cart-btn" class="btn btn--full" type="button">Add to Cart</button>
          </div>

          <section class="product-info-tabs product-info-tabs--sidebar" aria-label="Product information">
            <div class="product-info-tabs__nav" role="tablist">
              <button
                class="product-info-tabs__tab product-info-tabs__tab--active"
                type="button"
                role="tab"
                id="product-tab-btn-details"
                aria-selected="true"
                aria-controls="product-tab-details"
                data-tab="details"
              >
                Details
              </button>
              <button
                class="product-info-tabs__tab"
                type="button"
                role="tab"
                id="product-tab-btn-measurements"
                aria-selected="false"
                aria-controls="product-tab-measurements"
                data-tab="measurements"
              >
                Measurements
              </button>
              <button
                class="product-info-tabs__tab"
                type="button"
                role="tab"
                id="product-tab-btn-care"
                aria-selected="false"
                aria-controls="product-tab-care"
                data-tab="care"
              >
                Handling and Care
              </button>
            </div>

            <div class="product-info-tabs__panels">
              <div
                class="product-info-tabs__panel product-info-tabs__panel--active"
                id="product-tab-details"
                role="tabpanel"
                aria-labelledby="product-tab-btn-details"
              >
                <p id="product-description" class="product-info-tabs__text"></p>
              </div>
              <div
                class="product-info-tabs__panel"
                id="product-tab-measurements"
                role="tabpanel"
                aria-labelledby="product-tab-btn-measurements"
                hidden
              >
                <div id="product-measurements" class="product-info-tabs__text"></div>
              </div>
              <div
                class="product-info-tabs__panel"
                id="product-tab-care"
                role="tabpanel"
                aria-labelledby="product-tab-btn-care"
                hidden
              >
                <ul class="product-info-tabs__list">
                  <li>Wash cold. Lie flat to dry</li>
                </ul>
              </div>
            </div>
          </section>
        </aside>
      </article>
    </main>

    <footer class="site-footer">
      <div class="site-footer__inner">
        <a
          class="site-footer__social"
          href="https://www.instagram.com/visionssclothing/"
          target="_blank"
          rel="noopener noreferrer"
        >
          @visionssclothing
        </a>
        <a class="site-footer__logo-link" href="home.html">
          <img
            class="site-footer__logo"
            src="images/logo/visionsstudiostaroveris.png?v=2"
            alt="Visions"
          />
        </a>
        <a
          class="site-footer__social"
          href="https://www.tiktok.com/@visionscreative"
          target="_blank"
          rel="noopener noreferrer"
        >
          @visionscreative
        </a>
      </div>
    </footer>

    <script src="js/products.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/cart-drawer.js"></script>
    <script src="js/product.js"></script>
  </body>
</html>
